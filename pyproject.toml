[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astravulnx"
dynamic = ["version"]
description = "Rule-based web application security assessment scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meheraz Hossen Siam" }]
keywords = ["security", "web-security", "vulnerability-scanner", "owasp", "penetration-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/meherazhosensiam/-AstraVulnX-Scan"
Issues = "https://github.com/meherazhosensiam/-AstraVulnX-Scan/issues"

[project.scripts]
astravulnx = "astravulnx.cli:main"

[tool.setuptools.dynamic]
version = { attr = "astravulnx.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astravulnx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert-free unittest style, a deliberately vulnerable fixture and a broad
# except in a stub; none of this ships in the package.
"tests/*" = ["S", "B018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.bandit]
# Tests and the deliberately vulnerable fixture app are not shipped code.
exclude_dirs = ["tests"]
